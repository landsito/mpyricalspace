[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.13.1",
    "numpy>=2",
    "setuptools_scm>=7",
]

[project]
name = "mpyricalspace"
dynamic = ["version"]
description = "Python module that provides empirical predictions of of the near space environment."
readme = "README.md"
license = {file = "LICENSE"}
keyword = ["MPYRICALSPACE"]
authors = [{name = "Luis Navarro", email = "luis.navarro.dominguez@gmail.com"}]
classifiers = [
    "Development Status :: 2 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas",
    "xarray",
    "pymsis",
    "duckdb>=1.0",
    "pymongo",
    "pillow",
    "requests",
    "aacgmv2",                 # geographic -> AACGM, for the Weimer model in survey.run_track / run_grid
]

[project.optional-dependencies]
test = ["pytest"]
examples = ["matplotlib", "apexpy"]        # the examples/ plotting scripts
dev = [
    "mpyricalspace[test,examples]",
    "mypy",
    "pre-commit",
    "ruff",
]


[project.urls]
homepage = "https://github.com/landsito/mpyricalspace.git"
repository = "https://github.com/landsito/mpyricalspace.git"

[tool.meson-python.args]
# on macOS + conda you may need:  --config-settings=setup-args=--native-file=$PWD/native.txt
# (see README "Installation"); not forced here so a plain `pip install` works elsewhere.
#compile = ['-j4']
#install = ['--tags=bindings']
#dist = ['--include-subprojects']

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "node-and-date"
parentdir_prefix_version = "mpyricalspace-"
fallback_version = "0.0+UNKNOWN"

[tool.cibuildwheel]
# skip Python <3.10
# skip 32 bit windows and linux builds for lack of numpy wheels
skip = "cp36* cp37* cp38* cp39* *-win32 *_i686"
free-threaded-support = true
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.ruff]
target-version = "py310"
lint.select = ["B", "D", "E", "F", "I", "N", "S", "W", "PL", "PT", "UP", "RUF", "ANN"]
lint.ignore = ["B028", "D203", "D212", "PLR0913", "S310"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["ANN", "D", "PLR2004"]
"tests/*" = ["ANN", "D", "S"]
"mpyricalspace/_vscode.py" = ["S", "PLR2004"]
".github/*" = ["S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
lines-after-imports = 2
